apiVersion: apps/v1
kind: Deployment
metadata:
  name: hao-test-fe
  namespace: bookins-paas
  labels:
    app: hao-test-fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hao-test-fe
  template:
    metadata:
      labels:
        app: hao-test-fe
    spec:
      # No secrets are mounted: this is a static, public SPA.
      containers:
        - name: hao-test-fe
          image: ghcr.io/grokism/hao-test-fe:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
